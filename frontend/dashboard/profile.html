<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil — DeviceGuard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/theme.css"/>
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
<div id="navbar"></div>
<div class="max-w-lg mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">Profil</h1>

  <div id="successMsg" class="hidden bg-green-900/40 border border-green-700/50 text-green-300 text-sm rounded-xl px-4 py-3 mb-4 flex items-center gap-2">
    <i data-lucide="check-circle" class="w-4 h-4"></i><span id="successTxt"></span>
  </div>
  <div id="errMsg" class="hidden bg-red-900/40 border border-red-700/50 text-red-300 text-sm rounded-xl px-4 py-3 mb-4"></div>

  <!-- Info -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-4">
    <div class="flex items-center gap-4 mb-6">
      <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-xl font-bold" id="avatar">—</div>
      <div>
        <div class="font-bold text-lg" id="uName">—</div>
        <div class="text-gray-500 text-sm" id="uEmail">—</div>
        <span id="uBadge" class="mt-1 inline-block"></span>
      </div>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">To'liq ism</label>
        <input id="fullName" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Telefon</label>
        <input id="phone" placeholder="+998 90 000 00 00" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <button onclick="saveProfile()" id="saveBtn"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 rounded-xl text-sm font-semibold transition">
        Saqlash
      </button>
    </div>
  </div>

  <!-- Password -->
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
    <div class="font-semibold mb-4 text-sm">Parolni o'zgartirish</div>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Joriy parol</label>
        <input id="curPass" type="password" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Yangi parol</label>
        <input id="newPass" type="password" placeholder="Kamida 6 ta belgi" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <button onclick="changePassword()" id="passBtn"
        class="w-full py-2.5 bg-gray-700 hover:bg-gray-600 rounded-xl text-sm font-semibold transition">
        Parolni o'zgartirish
      </button>
    </div>
  </div>
</div>

<script>
document.getElementById('navbar').innerHTML = buildNavbar({ prefix: '../' });
lucide.createIcons();
if (!requireAuth()) throw '';

async function init() {
  const res = await fetch(`${API}/auth/me`, { headers: authHeaders() });
  if (res.status === 401) { logout(); return; }
  const u = await res.json();
  localStorage.setItem('dg_user', JSON.stringify(u));
  document.getElementById('avatar').textContent = (u.full_name || 'U')[0].toUpperCase();
  document.getElementById('uName').textContent = u.full_name;
  document.getElementById('uEmail').textContent = u.email;
  document.getElementById('fullName').value = u.full_name || '';
  document.getElementById('phone').value = u.phone || '';
  document.getElementById('uBadge').innerHTML = u.plan === 'pro'
    ? `<span class="bg-yellow-500/20 border border-yellow-500/40 text-yellow-400 text-xs font-bold px-2 py-0.5 rounded-full">⭐ PRO</span>`
    : `<span class="bg-gray-800 border border-gray-700 text-gray-400 text-xs px-2 py-0.5 rounded-full">FREE</span>`;
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  document.getElementById('successTxt').textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}
function showErr(msg) {
  const el = document.getElementById('errMsg');
  el.textContent = msg; el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 4000);
}

async function saveProfile() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
  const res = await fetch(`${API}/auth/profile`, {
    method: 'PUT', headers: authHeaders(),
    body: JSON.stringify({ full_name: document.getElementById('fullName').value, phone: document.getElementById('phone').value })
  });
  const data = await res.json();
  btn.disabled = false; btn.textContent = 'Saqlash';
  if (res.ok) { localStorage.setItem('dg_user', JSON.stringify(data)); showSuccess("Profil saqlandi!"); init(); }
  else showErr(data.detail || 'Xato');
}

async function changePassword() {
  const btn = document.getElementById('passBtn');
  btn.disabled = true; btn.textContent = 'O\'zgartirilmoqda...';
  const res = await fetch(`${API}/auth/change-password`, {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ current_password: document.getElementById('curPass').value, new_password: document.getElementById('newPass').value })
  });
  const data = await res.json();
  btn.disabled = false; btn.textContent = "Parolni o'zgartirish";
  if (res.ok) { document.getElementById('curPass').value = ''; document.getElementById('newPass').value = ''; showSuccess("Parol o'zgartirildi!"); }
  else showErr(data.detail || 'Xato');
}

init();
</script>
</body>
</html>
