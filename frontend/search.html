<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qurilma qidirish — DeviceGuard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/theme.css"/>
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
<div id="navbar"></div>
<div class="max-w-2xl mx-auto px-4 py-12">
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-blue-600/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
      <i data-lucide="search" class="w-8 h-8 text-blue-400"></i>
    </div>
    <h1 class="text-2xl font-bold mb-2">Qurilma qidirish</h1>
    <p class="text-gray-400 text-sm">Serial raqam yoki IMEI bo'yicha qurilmani tekshiring</p>
  </div>

  <div class="relative mb-6">
    <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-4 top-1/2 -translate-y-1/2"></i>
    <input id="searchInput" placeholder="Serial raqam yoki IMEI kiriting..."
      class="w-full bg-gray-900 border border-gray-800 rounded-2xl pl-11 pr-4 py-4 text-sm focus:outline-none focus:border-blue-500 transition"
      oninput="handleSearch()" onkeydown="if(event.key==='Enter')doSearch()"/>
    <button onclick="doSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-xl text-sm font-semibold transition">
      Qidirish
    </button>
  </div>

  <div id="hint" class="text-center text-gray-600 text-sm py-4">
    Kamida 4 ta belgi kiriting
  </div>
  <div id="loading" class="hidden text-center py-8 text-gray-600">
    <i data-lucide="loader-2" class="w-6 h-6 mx-auto animate-spin"></i>
  </div>
  <div id="results" class="space-y-3"></div>

  <div class="mt-10 text-center">
    <p class="text-gray-600 text-xs">Yo'qolgan qurilmangizni ro'yxatdan o'tkazish uchun:</p>
    <a href="register.html" class="text-blue-400 hover:underline text-sm mt-1 inline-block">Hisob yarating →</a>
  </div>
</div>

<script>
document.getElementById('navbar').innerHTML = buildNavbar({});
lucide.createIcons();

const STATUS_INFO = {
  active: { cls: 'bg-green-900/40 text-green-400 border-green-700/40', label: '✓ Faol' },
  lost:   { cls: 'bg-red-900/40 text-red-400 border-red-700/40',       label: '✗ Yo\'qolgan' },
  found:  { cls: 'bg-blue-900/40 text-blue-400 border-blue-700/40',    label: '◉ Topilgan' },
};
const CAT_ICON = { phone:'smartphone', laptop:'laptop', tablet:'tablet', watch:'watch', headphones:'headphones', camera:'camera', other:'package' };

let timer;
function handleSearch() {
  clearTimeout(timer);
  timer = setTimeout(doSearch, 500);
}

async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  const hint = document.getElementById('hint');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  results.innerHTML = '';
  if (q.length < 4) { hint.classList.remove('hidden'); return; }
  hint.classList.add('hidden');
  loading.classList.remove('hidden');
  try {
    const res = await fetch(`${API}/devices/public/search?q=${encodeURIComponent(q)}`);
    loading.classList.add('hidden');
    if (!res.ok) { results.innerHTML = `<p class="text-center text-gray-500 text-sm py-4">Xato yuz berdi</p>`; return; }
    const data = await res.json();
    if (!data.length) {
      results.innerHTML = `<div class="text-center py-8"><i data-lucide="search-x" class="w-10 h-10 mx-auto text-gray-700 mb-3"></i><p class="text-gray-500 text-sm">Qurilma topilmadi</p><p class="text-gray-600 text-xs mt-1">Ushbu serial raqam bazamizda yo'q</p></div>`;
      lucide.createIcons(); return;
    }
    results.innerHTML = data.map(d => {
      const st = STATUS_INFO[d.status] || STATUS_INFO.active;
      const icon = CAT_ICON[d.category] || 'package';
      return `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-4">
        <div class="flex items-start justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gray-800 rounded-xl flex items-center justify-center">
              <i data-lucide="${icon}" class="w-5 h-5 text-gray-400"></i>
            </div>
            <div>
              <div class="font-semibold text-sm">${d.name}</div>
              <div class="text-gray-500 text-xs">${d.brand} ${d.model}</div>
              <div class="text-gray-600 text-xs mt-0.5 font-mono">S/N: ${d.serial_number}</div>
            </div>
          </div>
          <span class="text-xs px-2 py-1 rounded-full border ${st.cls}">${st.label}</span>
        </div>
        ${d.status === 'lost' ? `
          <div class="mt-3 pt-3 border-t border-gray-800 text-sm space-y-1">
            ${d.last_location ? `<div class="text-gray-400 flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-gray-500"></i>${d.last_location}</div>` : ''}
            ${d.reward ? `<div class="text-yellow-400 flex items-center gap-1.5"><i data-lucide="dollar-sign" class="w-3.5 h-3.5"></i>Mukofot: $${d.reward}</div>` : ''}
          </div>` : ''}
      </div>`;
    }).join('');
    lucide.createIcons();
  } catch { loading.classList.add('hidden'); results.innerHTML = `<p class="text-center text-red-400 text-sm py-4">Server bilan ulanib bo'lmadi</p>`; }
}
</script>
</body>
</html>
