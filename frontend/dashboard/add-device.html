<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Qurilma qo'shish — DeviceGuard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/theme.css"/>
  <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/app.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen">
<div id="navbar"></div>
<div class="max-w-2xl mx-auto px-4 py-8">
  <div class="flex items-center gap-3 mb-6">
    <a href="index.html" class="p-2 text-gray-500 hover:text-white hover:bg-gray-800 rounded-xl transition">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
    </a>
    <h1 class="text-xl font-bold">Qurilma qo'shish</h1>
  </div>

  <div id="errMsg" class="hidden bg-red-900/40 border border-red-700/50 text-red-300 text-sm rounded-xl px-4 py-3 mb-4"></div>

  <form onsubmit="handleSubmit(event)" class="space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="col-span-2">
        <label class="text-xs text-gray-500 mb-1 block">Qurilma nomi *</label>
        <input id="name" required placeholder="Mening iPhone 15 Pro"
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Kategoriya *</label>
        <select id="category" required class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition">
          <option value="">Tanlang...</option>
          <option value="phone">📱 Telefon</option>
          <option value="laptop">💻 Noutbuk</option>
          <option value="tablet">🔲 Planshet</option>
          <option value="watch">⌚ Soat</option>
          <option value="headphones">🎧 Quloqchin</option>
          <option value="camera">📷 Kamera</option>
          <option value="other">📦 Boshqa</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Rang</label>
        <input id="color" placeholder="Qora, Kumush..."
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Brend *</label>
        <input id="brand" required placeholder="Apple, Samsung..."
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Model *</label>
        <input id="model" required placeholder="iPhone 15 Pro..."
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div class="col-span-2">
        <label class="text-xs text-gray-500 mb-1 block">Serial raqam *</label>
        <input id="serial_number" required placeholder="XXXX-XXXX-XXXX"
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm font-mono focus:outline-none focus:border-blue-500 transition"/>
        <p class="text-xs text-gray-600 mt-1">Settings → About da topasiz</p>
      </div>
      <div class="col-span-2">
        <label class="text-xs text-gray-500 mb-1 block">IMEI <span class="text-gray-600">(telefonlar uchun)</span></label>
        <input id="imei" placeholder="15 raqamli IMEI — *#06# ni tering"
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm font-mono focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Sotib olingan sana</label>
        <input id="purchase_date" type="date"
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition"/>
      </div>
      <div></div>
      <div class="col-span-2">
        <label class="text-xs text-gray-500 mb-1 block">Tavsif <span class="text-gray-600">(ixtiyoriy)</span></label>
        <textarea id="description" rows="3" placeholder="Maxsus belgilar, chiziqlar..."
          class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
      </div>
    </div>
    <div class="flex gap-3 pt-2">
      <a href="index.html" class="flex-1 py-3 border border-gray-700 hover:border-gray-600 rounded-xl text-sm font-semibold text-center text-gray-400 transition">Bekor qilish</a>
      <button type="submit" id="submitBtn" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-sm font-semibold transition">
        Qurilmani ro'yxatga olish
      </button>
    </div>
  </form>
</div>

<!-- Upgrade Modal -->
<div id="upgradeModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 px-4">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 max-w-sm w-full text-center">
    <div class="w-14 h-14 bg-blue-600/20 rounded-2xl flex items-center justify-center mx-auto mb-3">
      <i data-lucide="zap" class="w-7 h-7 text-blue-400"></i>
    </div>
    <div class="font-bold text-lg mb-1">Limit to'ldi</div>
    <p class="text-gray-400 text-sm mb-4" id="modalDesc">Bepul rejimda 3 ta qurilma qo'shish mumkin.</p>
    <a href="subscription.html" class="block w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-sm font-semibold transition mb-2">
      PRO ga o'tish — 10 ta qurilma
    </a>
    <a href="index.html" class="block text-gray-500 hover:text-gray-300 text-sm transition py-2">Orqaga</a>
  </div>
</div>

<script>
document.getElementById('navbar').innerHTML = buildNavbar({ prefix: '../' });
lucide.createIcons();
if (!requireAuth()) throw '';

async function handleSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');
  btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
  err.classList.add('hidden');
  try {
    const res = await fetch(`${API}/devices`, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({
        name: document.getElementById('name').value,
        brand: document.getElementById('brand').value,
        model: document.getElementById('model').value,
        category: document.getElementById('category').value,
        serial_number: document.getElementById('serial_number').value,
        imei: document.getElementById('imei').value || null,
        color: document.getElementById('color').value || null,
        description: document.getElementById('description').value || null,
        purchase_date: document.getElementById('purchase_date').value || null,
      })
    });
    const data = await res.json();
    if (res.status === 403 && data.detail?.error === 'LIMIT_REACHED') {
      document.getElementById('modalDesc').textContent =
        `Siz ${data.detail.plan === 'pro' ? 'PRO' : 'bepul'} rejimda ${data.detail.limit} ta qurilma limitiga yetdingiz.`;
      document.getElementById('upgradeModal').classList.remove('hidden');
      return;
    }
    if (!res.ok) { err.textContent = data.detail || 'Xato'; err.classList.remove('hidden'); return; }
    location.href = 'index.html';
  } catch { err.textContent = "Server bilan ulanib bo'lmadi"; err.classList.remove('hidden'); }
  btn.disabled = false; btn.textContent = "Qurilmani ro'yxatga olish";
}
</script>
</body>
</html>
